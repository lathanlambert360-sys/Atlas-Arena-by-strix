name: INFINITE Strix one-time verified build import
on:
  push:
    branches:
      - infinite-strix-live-globe-20261110
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[infinite-import-complete]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infinite-strix-live-globe-20261110
          persist-credentials: true
      - name: Retrieve pinned Vercel build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 90 'https://sb-2pft1q2pd1e1.vercel.run/infinite-strix.patch.gz' -o /tmp/infinite-strix.patch.gz
          echo 'f8330511023f0d7492d096287ddffba4c6f18c1906a628ffc9776fdb1ad7d905  /tmp/infinite-strix.patch.gz' | sha256sum -c
          gzip -dc /tmp/infinite-strix.patch.gz > /tmp/infinite-strix.patch
          echo '222f81431040a80157aad4a68d3fd6f98fbd90649a5a064bb47d0d6e299e1a76  /tmp/infinite-strix.patch' | sha256sum -c
          git apply --binary --check /tmp/infinite-strix.patch
          git apply --binary /tmp/infinite-strix.patch
          git add --all
          git config user.name 'INFINITE Build Agent'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(infinite): real Strix API gateway and 3D Earth [infinite-import-complete]'
          git push origin HEAD:infinite-strix-live-globe-20261110
      - name: Verify compiled UI and Python contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=atlas_hq python3 -m unittest atlas_hq.test_infinite_integrations -v
          cd strix/interface/viewer/frontend
          npm ci
          npx tsc --noEmit
          npm run build
